<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon-32.png" alt="" width="20" height="20" />
      <h1>YouTube Tidy</h1>
    </header>

    <section class="card">
      <div class="row">
        <div>
          <p class="label">Videos per row</p>
          <p class="hint">Home and channel pages</p>
        </div>
        <div class="stepper">
          <button id="fewer" type="button" aria-label="Fewer videos per row">−</button>
          <output id="itemsPerRow" aria-live="polite"></output>
          <button id="more" type="button" aria-label="More videos per row">+</button>
        </div>
      </div>
      <div id="preview" class="preview" aria-hidden="true"></div>
    </section>

    <section class="card list">
      <label class="row">
        <div>
          <p class="label">Small recommendations</p>
          <p class="hint">Sidebar next to the video</p>
        </div>
        <input class="switch" type="checkbox" role="switch" data-setting="compactRecommendations" />
      </label>
    </section>

    <h2>Hide</h2>
    <section class="card list">
      <label class="row">
        <div>
          <p class="label">Shorts</p>
          <p class="hint">Links open in the normal player</p>
        </div>
        <input class="switch" type="checkbox" role="switch" data-setting="hideShorts" />
      </label>
      <label class="row">
        <div>
          <p class="label">Playables and topic shelves</p>
        </div>
        <input class="switch" type="checkbox" role="switch" data-setting="hideShelves" />
      </label>
      <label class="row">
        <div>
          <p class="label">Topic chips</p>
          <p class="hint">Above the homepage grid</p>
        </div>
        <input class="switch" type="checkbox" role="switch" data-setting="hideChips" />
      </label>
      <label class="row">
        <div>
          <p class="label">Sidebar extras</p>
          <p class="hint">Keeps Home, You, Watch later</p>
        </div>
        <input class="switch" type="checkbox" role="switch" data-setting="trimSidebar" />
      </label>
    </section>

    <h2>Skip <span>via <a href="https://sponsor.ajay.app" target="_blank">SponsorBlock</a></span></h2>
    <section id="skipCategories" class="card list"></section>

    <template id="skipCategoryRow">
      <label class="row">
        <p class="label"><span class="dot"></span><span class="name"></span></p>
        <input class="switch" type="checkbox" role="switch" />
      </label>
    </template>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
